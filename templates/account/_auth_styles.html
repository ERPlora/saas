{% comment %}
  Styles of the template sign-in pages (`account/login.html`, `socialaccount/login.html`). The
  second-factor screens these styles also covered are Vue pages now (`accounts/frontend`).
{% endcomment %}
<style nonce="{{ csp_nonce }}">
    html, body { height: 100%; }
    body {
        background:
            radial-gradient(50% 40% at 70% 20%, color-mix(in oklch, var(--ion-color-primary) 10%, transparent) 0%, transparent 60%),
            radial-gradient(40% 35% at 15% 80%, color-mix(in oklch, var(--mod-purple) 6%, transparent) 0%, transparent 70%),
            var(--ion-color-step-50);
    }
    .login-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
    }
    .auth-card {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.75rem;
    }
    .biz-name {
        font-weight: 600;
        font-size: 1.65rem;
        letter-spacing: -0.02em;
        text-align: center;
    }
    .biz-sub {
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: color-mix(in oklch, var(--ion-text-color) 50%, transparent);
        margin-top: 0.4rem;
        text-align: center;
    }
    /* The form's card is an ion-card: a translucent glass surface + border + shadow over the
       local tokens, the container's full width (auth-card centres its children) and without the
       default margin. */
    .auth-card ion-card {
        width: 100%;
        margin: 0;
        overflow: visible;
    }
    .auth-card ion-card.glass {
        --background: transparent;
        background: color-mix(in oklch, var(--ion-background-color) 88%, transparent);
        backdrop-filter: blur(8px);
        border: 1px solid color-mix(in oklch, var(--ion-text-color) 12%, transparent);
        box-shadow: 0 12px 40px -14px rgba(0, 0, 0, 0.18);
        border-radius: 14px;
        color: var(--ion-text-color);
    }
    /* Ionic topbar (back button), transparent over the page background. */
    .auth-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
    }
    .auth-toolbar {
        --background: transparent;
        --border-width: 0;
    }
    .auth-back {
        --color: color-mix(in oklch, var(--ion-text-color) 60%, transparent);
        text-transform: none;
        font-size: 13px;
    }
    .auth-back:hover {
        --color: var(--ion-text-color);
    }
    .auth-back iconify-icon {
        margin-right: 0.35rem;
    }
    .field { display: flex; flex-direction: column; gap: 0.35rem; }
    .field + .field { margin-top: 0.85rem; }
    .row-between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 1rem;
        font-size: 13px;
    }
    .row-between a { color: var(--ion-color-primary); }
    .row-between a:hover { text-decoration: underline; }
    .form-error {
        margin-top: 0.4rem;
        color: var(--ion-color-danger);
        font-size: 12.5px;
    }
    .non-field-error {
        margin-bottom: 0.85rem;
        padding: 0.65rem 0.85rem;
        border: 1px solid color-mix(in oklch, var(--ion-color-danger) 35%, transparent);
        background: color-mix(in oklch, var(--ion-color-danger) 8%, transparent);
        color: var(--ion-color-danger);
        border-radius: 0.5rem;
        font-size: 13px;
    }
    .foot {
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 11px;
        color: color-mix(in oklch, var(--ion-text-color) 45%, transparent);
        text-align: center;
    }
    .foot a { color: var(--ion-color-primary); }
    .foot a:hover { text-decoration: underline; }
</style>
