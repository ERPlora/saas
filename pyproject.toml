[project]
name = "saas"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "daphne>=4.2",
    "erplora-live",
    "psycopg[binary,pool]>=3.3",
    "whitenoise>=6.12",
    "python-decouple>=3.8",
    "django-allauth[socialaccount,headless,headless-spec,mfa]>=65.18",
    # The public web: cookie consent, the contact form's rate limit, the app downloads
    # bucket, IndexNow and the cleaning of the apps' icons.
    "django-cookie-consent>=0.7",
    "django-ratelimit>=4.1",
    "boto3>=1.40",
    "requests>=2.32",
    "nh3>=0.3",
    # Django's RedisCache client for the shared Valkey (VALKEY_URL).
    "redis>=8.1.0",
    # Mail through the SES API, signed by the task role (SES_REGION).
    "django-ses>=4.8.2",
    # The fiscal seal's .p12 (report_seal_expiry reads its certificate's expiry).
    "cryptography>=50.0",
    # Stripe: Embedded Checkout, the hub's subscription and its items, the webhook.
    "stripe>=16.0",
    # The VeriFactu gateway (fiscal_gateway/): mTLS to the AEAT with a client certificate.
    "httpx>=0.28",
    # The Anexo I model (fiscal/model.py): the official PDF filled in and stamped (pypdf), the text and the
    # stamp drawn on a layer and the data protection page (reportlab).
    "pypdf>=6.0",
    "reportlab>=4.4",
    "django-auditlog>=3.4.1",
    # The assistant's attachments (assistant/attachments.py): the text of a Word document and of a spreadsheet.
    "python-docx>=1.2",
    "openpyxl>=3.1",
    # The panel's assistant searches ERPlora's documentation by its fingerprints (assistant.DocChunk): pgvector's
    # VectorField and CosineDistance; the extension `vector` in Postgres (Aurora, compose, CI).
    "pgvector>=0.5",
    "dnspython>=2.8",
    "idna>=3.10",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4.14",
    "pytest-asyncio>=1.4",
    "respx>=0.23.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
    "import-linter>=2.16",
    "complexipy>=9.0.0",
]

# erplora-live is the packages/live submodule (`git submodule update --init`); editable locally,
# the Dockerfile installs it with --no-editable.
[tool.uv.sources]
erplora-live = { path = "packages/live", editable = true }

# ruff checks how big and how branchy each function is, and the common mistakes of the rule families E4, E7, E9, F, B
# and DJ (tests/test_guardrails_lint.py runs it, tests/test_guardrails_ruff.py pins this configuration down). It is not
# a formatter. The functions over a limit today carry a `# noqa` for it, and RUF100 fails on one that no longer
# silences anything.
[tool.ruff]
extend-exclude = ["packages", "migrations"]
# The exclusions hold for a file named on the command line too, so `ruff format <file>` leaves it alone.
force-exclude = true

# The code is written about 120 columns wide: ruff's formatter is off for every file.
[tool.ruff.format]
exclude = ["*"]

[tool.ruff.lint]
select = ["B", "C901", "DJ", "E4", "E7", "E9", "F", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "RUF100"]
# Rules the code's older `# noqa` markers name where ruff reports nothing (another linter's rule, or a line other than
# the one ruff reports): RUF100 keeps those markers instead of reporting them as unused.
external = ["A002", "BLE001", "E402", "F811", "PT011", "S308"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

# pytest hands fixtures over as arguments, so a test's argument count says nothing about its size, and a fixture comes
# back as an argument under the name it was imported with (F811).
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["F811", "PLR0913", "PLR0917"]
"**/e2e/**" = ["F811", "PLR0913", "PLR0917"]
"**/test_*.py" = ["F811", "PLR0913", "PLR0917"]
"**/conftest.py" = ["F811", "PLR0913", "PLR0917"]
# What broke one of the rule families when it came in, one file per line: it only shrinks. Fix the code instead of
# adding a line; tests/test_guardrails_ruff.py says when a line has to go.
"accounts/admin/__init__.py" = ["F401"]
"accounts/queries/__init__.py" = ["F401"]
"accounts/services/__init__.py" = ["F401"]
"accounts/tests/test_support_report.py" = ["F401"]
"apps/admin.py" = ["DJ007"]
"assistant/turn.py" = ["B023"]
"base/tests/test_assistant_asks.py" = ["B905"]
"base/tests/test_queries.py" = ["B008"]
"billing/admin/__init__.py" = ["F401"]
"billing/models/__init__.py" = ["F401"]
"billing/queries/__init__.py" = ["F401"]
"billing/services/__init__.py" = ["F401"]
"billing/tests/test_unpaid.py" = ["B017"]
"config/settings/__init__.py" = ["F403"]
"hubs/admin.py" = ["DJ007"]
"hubs/models/__init__.py" = ["F401"]
"hubs/queries/__init__.py" = ["F401"]
"hubs/schemas/__init__.py" = ["F401"]
"hubs/services/__init__.py" = ["F401"]
"hubs/tests/test_admin.py" = ["F401"]
"hubs/tests/test_api_keys.py" = ["F401"]
"hubs/tests/test_business_queries.py" = ["B017", "B905"]
"hubs/tests/test_demo_seed.py" = ["F401"]
"hubs/tests/test_migrations_plan_cards.py" = ["B905"]
"hubs/tests/test_services_opening.py" = ["B017"]
"hubs/tests/test_session_revocations.py" = ["F401"]
"public/tests/pricing_pages.py" = ["B905"]
"public/tests/test_demo.py" = ["B007"]
"public/tests/test_landing_templates.py" = ["B905"]
"public/tests/test_pricing_templates.py" = ["B905"]
"public/tests/test_response_tokens.py" = ["B905"]
"public/tests/test_templates.py" = ["F541"]
"whatsapp/services.py" = ["F401"]
"whatsapp/tests/test_channel_contract.py" = ["F401"]

# complexipy (`uv run complexipy`; tests/test_guardrails_complexity.py runs it): no function's cognitive complexity
# goes over 15, and no ignore comment switches that off. complexipy-snapshot.json froze the functions over it when it
# came in: it only shrinks. Migrations are generated, and the live and ui submodules are checked in their own repos.
# complexipy skips hidden folders, so .github, with the deploy's scripts, is named on its own.
[tool.complexipy]
paths = [".", ".github"]
exclude = ["**/migrations/**", "packages/**"]
max-complexity-allowed = 15
no-ignore = true

# import-linter (`uv run lint-imports`; tests/test_guardrails_imports.py runs it): inside every package, at any depth,
# no sibling modules import each other in a circle. Tests are out of the contract. The rest of its ignore_imports froze
# what broke it when it came in: it only shrinks.
[tool.importlinter]
root_packages = [
    "accounts", "apps", "assistant", "base", "billing", "config", "fiscal", "fiscal_gateway", "hubs", "public",
    "whatsapp",
]

[[tool.importlinter.contracts]]
id = "no-sibling-cycles"
name = "No sibling modules import each other in a circle"
type = "acyclic_siblings"
ancestors = [
    "accounts", "apps", "assistant", "base", "billing", "config", "fiscal", "fiscal_gateway", "hubs", "public",
    "whatsapp",
]
ignore_imports = [
    "**.tests.** -> **",
    "accounts.models -> accounts.queries.account_lookup",
    "accounts.models -> accounts.services.account_businesses",
    "assistant.attachments -> assistant.turn",
    "assistant.schemas -> assistant.media",
    "billing.vat -> billing.queries",
]
