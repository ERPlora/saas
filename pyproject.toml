[project]
name = "saas"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "daphne>=4.2",
    "erplora-live",
    "psycopg[binary,pool]>=3.3",
    "whitenoise>=6.12",
    "python-decouple>=3.8",
    "django-allauth[socialaccount,headless,headless-spec,mfa]>=65.18",
    # The public web: cookie consent, the contact form's rate limit, the app downloads
    # bucket, IndexNow and the cleaning of the apps' icons.
    "django-cookie-consent>=0.7",
    "django-ratelimit>=4.1",
    "boto3>=1.40",
    "requests>=2.32",
    "nh3>=0.3",
    # Django's RedisCache client for the shared Valkey (VALKEY_URL).
    "redis>=8.1.0",
    # Mail through the SES API, signed by the task role (SES_REGION).
    "django-ses>=4.8.2",
    # The fiscal seal's .p12 (report_seal_expiry reads its certificate's expiry).
    "cryptography>=50.0",
    # Stripe: Embedded Checkout, the hub's subscription and its items, the webhook.
    "stripe>=16.0",
    # The VeriFactu gateway (fiscal_gateway/): mTLS to the AEAT with a client certificate.
    "httpx>=0.28",
    # The Anexo I model (fiscal/model.py): the official PDF filled in and stamped (pypdf), the text and the
    # stamp drawn on a layer and the data protection page (reportlab).
    "pypdf>=6.0",
    "reportlab>=4.4",
    "django-auditlog>=3.4.1",
    # The assistant's attachments (assistant/attachments.py): the text of a Word document and of a spreadsheet.
    "python-docx>=1.2",
    "openpyxl>=3.1",
    # The panel's assistant searches ERPlora's documentation by its fingerprints (assistant.DocChunk): pgvector's
    # VectorField and CosineDistance; the extension `vector` in Postgres (Aurora, compose, CI).
    "pgvector>=0.5",
    "dnspython>=2.8",
    "idna>=3.10",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4.14",
    "pytest-asyncio>=1.4",
    "respx>=0.23.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
]

# erplora-live is the packages/live submodule (`git submodule update --init`); editable locally,
# the Dockerfile installs it with --no-editable.
[tool.uv.sources]
erplora-live = { path = "packages/live", editable = true }

# Only the limits of a function's size: no formatter and none of ruff's default rules. The functions over a limit
# today carry a `# noqa` for it, and RUF100 fails on one that no longer silences anything
# (tests/test_guardrails_lint.py runs this from the suite).
[tool.ruff]
extend-exclude = ["packages", "migrations"]
# The exclusions hold for a file named on the command line too, so `ruff format <file>` leaves it alone.
force-exclude = true

# The code is written about 120 columns wide: ruff's formatter is off for every file.
[tool.ruff.format]
exclude = ["*"]

[tool.ruff.lint]
select = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "RUF100"]
# Rules of other linters the code already carries a `# noqa` for: RUF100 leaves those markers alone.
external = ["A002", "B017", "BLE001", "E402", "F401", "F403", "F811", "F821", "PT011", "S308"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

# pytest's fixtures arrive as arguments.
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR0913", "PLR0917"]
"**/e2e/**" = ["PLR0913", "PLR0917"]
"**/test_*.py" = ["PLR0913", "PLR0917"]
"**/conftest.py" = ["PLR0913", "PLR0917"]
