[project]
name = "saas"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "daphne>=4.2",
    "erplora-live",
    "psycopg[binary,pool]>=3.3",
    "whitenoise>=6.12",
    "python-decouple>=3.8",
    "django-allauth[socialaccount,headless,headless-spec,mfa]>=65.18",
    # The public web (round 16): cookie consent, the contact form's rate limit, the app downloads
    # bucket, IndexNow and the cleaning of the apps' icons.
    "django-cookie-consent>=0.7",
    "django-ratelimit>=4.1",
    "boto3>=1.40",
    "requests>=2.32",
    "nh3>=0.3",
    # Django's RedisCache client for the shared Valkey (VALKEY_URL).
    "redis>=8.1.0",
    # Mail through the SES API, signed by the task role (SES_REGION).
    "django-ses>=4.8.2",
    # The fiscal seal's .p12 (report_seal_expiry reads its certificate's expiry).
    "cryptography>=50.0",
    # Stripe (lot L2-B): Embedded Checkout, the hub's subscription and its items, the webhook.
    "stripe>=16.0",
    # The VeriFactu gateway (fiscal_gateway/): mTLS to the AEAT with a client certificate.
    "httpx>=0.28",
    # The Anexo I model (fiscal/model.py): the official PDF filled in and stamped (pypdf), the text and the
    # stamp drawn on a layer and the data protection page (reportlab).
    "pypdf>=6.0",
    "reportlab>=4.4",
    "django-auditlog>=3.4.1",
    # The assistant's attachments (assistant/attachments.py): the text of a Word document and of a spreadsheet.
    "python-docx>=1.2",
    "openpyxl>=3.1",
    # The panel's assistant searches ERPlora's documentation by its fingerprints (assistant.DocChunk): pgvector's
    # VectorField, HnswIndex and CosineDistance; the extension `vector` in Postgres (Aurora, compose, CI).
    "pgvector>=0.5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4.14",
    "pytest-asyncio>=1.4",
    "respx>=0.23.1",
    "pytest-xdist>=3.8.0",
]

# erplora-live is the packages/live submodule (`git submodule update --init`); editable locally,
# the Dockerfile installs it with --no-editable.
[tool.uv.sources]
erplora-live = { path = "packages/live", editable = true }
