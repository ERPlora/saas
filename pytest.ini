[pytest]
DJANGO_SETTINGS_MODULE = config.settings_pytest
pythonpath = .
testpaths = base config accounts apps hubs billing fiscal fiscal_gateway public whatsapp
# packages/ holds the live and ui submodules: live's suite runs in its own checkout
# (`cd packages/live && uv run pytest -q`).
norecursedirs = packages node_modules .* *.egg _darcs build CVS dist venv {arch}
filterwarnings =
    # WhiteNoise warns that STATIC_ROOT does not exist until `collectstatic` has run.
    ignore:No directory at.*staticfiles:UserWarning
