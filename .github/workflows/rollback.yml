name: rollback

# Manual: puts the saas service of the branch's environment (main -> prod: saas; pre -> pre:
# saas-pre; plan 2026-10-14-entorno-pre) back on the ACTIVE revision right before the one it runs
# and records its image tag (ecs-rollback.sh). Migrations are not undone. Scheduled saas tasks (prod
# only) run the latest ACTIVE saas-cron revision, so they keep the newer image: to go back
# everywhere, run deploy with the previous release instead.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The environment of the branch this run uses (main -> prod, pre -> pre)
        type: choice
        options: [prod, pre]
        default: prod
      confirm:
        description: Type ROLLBACK to put saas back on its previous revision (migrations are not undone)
        type: string
        required: true

permissions:
  contents: read

# Shares the deploy group of the branch: a rollback never runs during a deploy of the same
# environment, nor the other way round.
concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # gha-deploy-saas or gha-deploy-saas-pre (OIDC)
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      # Before assuming the role; ecs-rollback.sh checks CONFIRM again.
      - name: Check the confirmation and the repository variables
        run: |
          if [ "$CONFIRM" != ROLLBACK ]; then
            echo "::error::type ROLLBACK to confirm, not '$CONFIRM'; nothing was changed"
            exit 1
          fi
          if [ -z "$AWS_REGION" ]; then
            echo "::error::empty repository variables: AWS_REGION (aws-next README, step 19)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The branch must be main or pre and the input its environment; its own deploy role.
      - name: Pick the environment of the branch
        id: env
        env:
          PROJECT: saas
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_DEPLOY_ROLE_ARN_PRE: ${{ vars.AWS_DEPLOY_ROLE_ARN_PRE }}
        run: bash .github/scripts/deploy-env.sh
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.env.outputs.role_arn }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Roll saas back
        env:
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
        run: bash .github/scripts/ecs-rollback.sh
