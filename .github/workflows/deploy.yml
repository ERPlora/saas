name: deploy

# Push to main -> once the environment is known, test (test.yml) and, side by side, build the saas
# image (tag = commit SHA) into prod's ECR repository; once both pass, publish the release
# saas-vYYYY.MM.DD.N and deploy it to prod (ecs-deploy.sh; aws-next README, "Contrato").
# Push to pre -> the same into pre's own ECR repository (erplora/saas-pre), deployed to pre
# (pre.erplora.com; plan 2026-10-14-entorno-pre), waking pre up if its schedule had stopped it; no
# release: releases are prod's.
# Manual run -> the same for the branch it runs on, whose environment it must name (main -> prod,
# pre -> pre); with a release (prod only), redeploy that release's image, without test nor build.
# Only the deploy job waits for the one before it (its concurrency): the test and build of a newer
# push run while an older one deploys. So an image whose tests failed may be in ECR, under its
# commit, but nothing deploys it: deploy needs test and build to pass, a release is only cut by a
# deploy that passed them, and rollback.yml only goes back to revisions that already ran.
# Back to the previous revisions without a release: rollback.yml.
# The release is created here on purpose: one made with GITHUB_TOKEN triggers no other workflow.

on:
  push:
    branches: [main, pre]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: The environment of the branch this run uses (main -> prod, pre -> pre)
        type: choice
        options: [prod, pre]
        default: prod
      release:
        description: Release to redeploy to prod (e.g. saas-v2026.10.13.1); empty = test, build and deploy the branch
        type: string
        required: false
        default: ""

# Each job asks for what it needs: id-token only in build and deploy, because the OIDC token of any
# job of a push to main or pre carries the sub that gha-deploy-saas or gha-deploy-saas-pre trusts
# (repo:ERPlora/saas:ref:refs/heads/<branch>), and the test jobs run third-party code (pnpm and uv
# installs). The repo is public: no pull_request trigger, so a fork never runs this workflow.
permissions:
  contents: read

jobs:
  # First, so a run of another branch, a manual run for the other environment or a release asked of
  # pre fails before the tests and the build (deploy-env.sh).
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      ecr_repository: ${{ steps.env.outputs.ecr_repository }}
      readyz_host: ${{ steps.env.outputs.readyz_host }}
      role_arn: ${{ steps.env.outputs.role_arn }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Pick the environment of the branch
        id: env
        env:
          PROJECT: saas
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_RELEASE: ${{ inputs.release }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_DEPLOY_ROLE_ARN_PRE: ${{ vars.AWS_DEPLOY_ROLE_ARN_PRE }}
        run: bash .github/scripts/deploy-env.sh

  # Its check, `test / test`, is the one main and pre require (ci.yml runs it on every other branch).
  test:
    needs: environment
    if: inputs.release == ''
    uses: ./.github/workflows/test.yml

  # The image of the commit, side by side with test, pushed to the environment's ECR repository only
  # once docker/image.test.sh passes on it.
  build:
    needs: environment
    if: inputs.release == ''
    # saas is public: native arm64 (ubuntu-24.04-arm, free for public repos) by default; QEMU only
    # when BUILD_RUNNER points at an x86 runner.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # gha-deploy-saas or gha-deploy-saas-pre (OIDC): the push to ECR
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ needs.environment.outputs.ecr_repository }}
    steps:
      # The branch and its deploy role were checked by the environment job.
      - name: Check the repository variables
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo "::error::empty repository variable: AWS_REGION (aws-next README, step 19)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # the build context needs packages/live and packages/ui
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        id: aws
        with:
          role-to-assume: ${{ needs.environment.outputs.role_arn }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to ECR
        id: ecr
        env:
          ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
        run: |
          registry="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      # Into the environment's own repository: erplora/saas (prod) or erplora/saas-pre (pre).
      - name: Check whether the image is already in ECR
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # ECR tags are immutable: a re-run of the same commit keeps its image.
          if found="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" \
            --region "$AWS_REGION" 2>&1)"; then
            echo "$image is already in ECR"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$found" != *ImageNotFoundException* ]]; then
            echo "::error::cannot check $ECR_REPOSITORY:$GITHUB_SHA in ECR: $found"
            exit 1
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      # Only on an x86 BUILD_RUNNER: the default ARM runner builds linux/arm64 natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.image.outputs.exists == 'false' && runner.arch != 'ARM64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.image.outputs.exists == 'false'
      # Layers cached in GitHub's cache (type=gha; build-push-action hands buildx the runtime token a
      # `run` step lacks). Not in ECR: its tags are immutable and a cache tag is rewritten on every
      # build. Loaded into the runner's Docker, so the very image tested below is the one pushed.
      - name: Build the image (linux/arm64)
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: . # the checkout, with its submodules (not the git context)
          platforms: linux/arm64
          provenance: false
          sbom: false
          load: true
          push: false
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test the image
        if: steps.image.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: bash docker/image.test.sh "$IMAGE"
      - name: Push the image
        if: steps.image.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          if ! docker push "$IMAGE"; then
            # Another run of this commit (a manual run during its push run) may have pushed it first:
            # ECR tags are immutable, and that image passed the same tests.
            if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" \
              --region "$AWS_REGION" > /dev/null 2>&1; then
              echo "$IMAGE was pushed by another run of this commit"
              exit 0
            fi
            echo "::error::cannot push $IMAGE"
            exit 1
          fi

  deploy:
    needs: [environment, test, build]
    # A redeploy (release given) skips test and build on purpose.
    if: ${{ !cancelled() && needs.environment.result == 'success' && ((needs.test.result == 'success' && needs.build.result == 'success') || (inputs.release != '' && needs.test.result == 'skipped' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write # the GitHub Release
      id-token: write # gha-deploy-saas or gha-deploy-saas-pre (OIDC)
    # Deploys and rollbacks (rollback.yml, same group) of one branch, and so of one environment, never
    # overlap and none is cancelled halfway; prod (main) and pre (pre) do not wait for each other.
    # Only this job waits: deploy-order.sh keeps an older push that gets the lock after a newer one
    # from moving the environment back.
    concurrency:
      group: deploy-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      RELEASE: ${{ inputs.release }}
      ENVIRONMENT: ${{ needs.environment.outputs.environment }}
      ECR_REPOSITORY: ${{ needs.environment.outputs.ecr_repository }}
    steps:
      # The branch and its deploy role were checked by the environment job.
      - name: Check the repository variables
        env:
          ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
        run: |
          missing=""
          for var in AWS_REGION ALB_DNS_NAME; do
            if [ -z "${!var}" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::empty repository variables:$missing (aws-next README, step 19)"
            exit 1
          fi

      # The deploy builds nothing: no submodules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag and the history: the version, the release notes and deploy-order.sh
          persist-credentials: false

      - name: Pick the commit to deploy
        id: commit
        run: |
          if [ -z "$RELEASE" ]; then
            sha="$GITHUB_SHA"
          else
            if ! [[ "$RELEASE" =~ ^saas-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
              echo "::error::'$RELEASE' is not a saas release (saas-vYYYY.MM.DD.N)"
              exit 1
            fi
            if ! sha="$(git rev-list -n 1 "refs/tags/$RELEASE" 2> /dev/null)"; then
              echo "::error::there is no release $RELEASE"
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deploying the saas at $sha"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        id: aws
        with:
          role-to-assume: ${{ needs.environment.outputs.role_arn }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: The ECR registry
        id: ecr
        env:
          ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
        run: echo "registry=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_OUTPUT"

      # An older push that gets the lock after a newer one has deployed deploys nothing. ENVIRONMENT
      # (job env) picks the parameter it reads: /erplora/<environment>/saas/image_tag.
      - name: Never back to an older commit
        id: order
        env:
          IMAGE_TAG: ${{ steps.commit.outputs.sha }}
        run: bash .github/scripts/deploy-order.sh

      # Releases are prod's: pre deploys the head of its branch.
      - name: Tag and publish the release
        if: inputs.release == '' && needs.environment.outputs.environment == 'prod' && steps.order.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A re-run of the same commit keeps its release.
          existing="$(git tag --points-at "$GITHUB_SHA" --list 'saas-v*')"
          if [ -n "$existing" ]; then
            echo "already released as $existing"
            exit 0
          fi
          tag="$(git tag --list 'saas-v*' | bash .github/scripts/next-version.sh saas "$(date -u +%Y.%m.%d)")"
          previous="$(git tag --list 'saas-v*' --sort=-v:refname | head -1)"
          # Notes: the commits since the previous release (all of them on the first one).
          git log --format='- %s (%h)' "${previous:+$previous..}$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "saas ${tag#saas-v}" --notes-file "$RUNNER_TEMP/notes.md"
          echo "released $tag"

      # ECR keeps the last 10 images (aws-next stacks/shared/ecr.tf): an old release may be gone.
      - name: Check the image exists
        if: steps.order.outputs.deploy == 'true'
        env:
          IMAGE_TAG: ${{ steps.commit.outputs.sha }}
        run: |
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" \
            --region "$AWS_REGION" > /dev/null; then
            echo "::error::$ECR_REPOSITORY:$IMAGE_TAG is not in ECR (expired by the retention of 10?)"
            exit 1
          fi

      # ENVIRONMENT (job env) picks the families, the service and the parameter of prod or pre.
      - name: Register revisions, migrate, update the service
        if: steps.order.outputs.deploy == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.commit.outputs.sha }}
        run: bash .github/scripts/ecs-deploy.sh

      # Through the ALB by name, so it also works before the DNS cutover: erplora.com (prod) or
      # pre.erplora.com (pre), both on the same ALB.
      - name: Check /readyz on the environment's host
        if: steps.order.outputs.deploy == 'true'
        env:
          ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
          READYZ_HOST: ${{ needs.environment.outputs.readyz_host }}
        run: |
          curl --fail --silent --show-error --max-time 10 \
            --retry 10 --retry-delay 15 --retry-all-errors \
            --connect-to "${READYZ_HOST}:443:${ALB_DNS_NAME}:443" \
            "https://${READYZ_HOST}/readyz"
