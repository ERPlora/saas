name: nightly

# Every e2e spec, every night, on main (saas#296): a push only runs the specs it touches (test.yml), so a change
# that breaks a spec it never touched, or a spec nobody ran, would stay red unseen until someone ran it by hand
# (saas#285). Never part of a check: a red night stops no PR and no deploy. It keeps ONE open issue instead
# (e2e-report.sh): a red night opens it or comments on it, and the first green night closes it. A schedule only
# runs from the default branch; `workflow_dispatch` reruns it by hand (writing the issue only from main).

on:
  schedule:
    # 03:17 UTC, off the hour (GitHub delays the busy ones): 04:17 or 05:17 in Madrid.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One nightly at a time: a dispatch near the cron, or a night that overruns into the next, would otherwise have two
# reports look for the issue at once and open it twice. The second waits; none is cancelled half way.
concurrency:
  group: nightly-${{ github.repository }}
  cancel-in-progress: false

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      specs: all

  # Whatever e2e's result, a timeout included; not when someone cancels the run by hand.
  report:
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # The script only: no submodules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only a red e2e uploads its report; one that died before writing it (a timeout) leaves none, which
      # e2e-report.sh says in the issue.
      - if: needs.e2e.result != 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-report
          path: ${{ runner.temp }}/e2e-report
      - name: Report the night
        env:
          RESULT: ${{ needs.e2e.result }}
          REPORT: ${{ runner.temp }}/e2e-report/report.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/e2e-report.sh
