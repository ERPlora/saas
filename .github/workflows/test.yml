name: test

# The saas's tests: the workflows (actionlint), the scripts (shellcheck and their tests), pytest and
# the front (lint, typecheck, Vitest and the build). Called by deploy.yml (pushes to main and pre)
# and ci.yml (every other branch): its check, `test / test`, is the one main and pre require (plan
# 2026-10-14-entorno-pre, §7.5).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d saas"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # The defaults of config/settings.py, spelled out; pytest creates test_saas_next.
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: saas
      DB_USER: hub
      DB_PASSWORD: hub
    steps:
      # packages/live and packages/ui are submodules (ERPlora/live, ERPlora/ui) over HTTPS.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Lint the workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Lint the scripts (shellcheck)
        run: shellcheck .github/scripts/*.sh
      - name: Script tests
        run: for t in .github/scripts/*.test.sh; do bash "$t"; done

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # --locked: uv.lock must match pyproject.toml (the lock the Dockerfile installs from).
      - run: uv sync --locked
      - run: uv run --locked pytest -q

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.7 # = packageManager of package.json and the Dockerfile's PNPM_VERSION
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
